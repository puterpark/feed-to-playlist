<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + ${site.name}">Feed to Playlist</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site" th:fragment="header">
  <div class="wrap">
    <a class="brand" th:href="@{/}" th:text="${site.name}">Feed to Playlist</a>
    <nav>
      <a th:href="@{/terms}">서비스 약관</a>
      <a th:href="@{/privacy}">개인정보처리방침</a>
    </nav>
  </div>
</header>
<footer class="site" th:fragment="footer">
  <div class="wrap">
    <p>
      <a th:href="@{/}">홈</a>
      <a th:href="@{/terms}">서비스 약관</a>
      <a th:href="@{/privacy}">개인정보처리방침</a>
    </p>
    <p>
      <span th:text="${site.name}">Feed to Playlist</span> 은(는) YouTube 와 제휴하거나 YouTube 가 보증하는 서비스가 아닙니다.
    </p>
  </div>
</footer>
</body>
</html>
